server {
    # PORT vient de Railway (80 en local) : l'image officielle remplace ${PORT} au démarrage.
    listen ${PORT};
    root /usr/share/nginx/html;
    index index.html;

    # Application monopage : toute route inconnue renvoie index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html jamais mis en cache : un nouveau déploiement est vu tout de suite.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
