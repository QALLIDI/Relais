# Plateforme de pré-sélection — stack local.
#   docker compose up -d --build
# Front : http://localhost:3000 · Keycloak : http://localhost:8180 · Mailpit : http://localhost:8025
# Observabilité (Prometheus, Grafana, ELK) : à ajouter sous le profil « observabilite ».

x-service: &service
  restart: unless-stopped
  environment: &service-env
    DB_HOST: postgres
    DB_USER: ${POSTGRES_USER}
    DB_PASSWORD: ${POSTGRES_PASSWORD}
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_USER: ${RABBITMQ_USER}
    RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    KEYCLOAK_INTERNAL_URL: http://keycloak:8080
    KEYCLOAK_PUBLIC_URL: http://localhost:8180
    JAVA_OPTS: -XX:MaxRAMPercentage=75
  mem_limit: 512m
  depends_on: &service-deps
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    keycloak:
      condition: service_healthy

services:
  # ---------------- Infrastructure ----------------
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20

  minio:
    # Les images officielles minio/minio ne sont plus publiques : même binaire MinIO, publié par Chainguard.
    image: cgr.dev/chainguard/minio:latest
    # L'image tourne en utilisateur non root, qui ne peut pas écrire dans le volume nommé.
    user: "0:0"
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      # L'émetteur des jetons reste http://localhost:8180 même quand les services appellent keycloak:8080.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: -Xms256m -Xmx640m
    ports:
      - "8180:8080"
    volumes:
      - ./infra/keycloak/realm-recrutement.json:/opt/keycloak/data/import/realm-recrutement.json:ro
      - ./infra/keycloak/themes/recrut:/opt/keycloak/themes/recrut:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ---------------- Services ----------------
  gateway-service:
    build:
      context: ./backend
      args:
        SERVICE: gateway-service
    restart: unless-stopped
    mem_limit: 512m
    environment:
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: http://localhost:8180
      ENTREPRISE_SERVICE_URL: http://entreprise-service:8082
      CANDIDAT_SERVICE_URL: http://candidat-service:8083
      SELECTION_SERVICE_URL: http://selection-service:8084
      FACTURATION_SERVICE_URL: http://facturation-service:8085
      NOTIFICATION_SERVICE_URL: http://notification-service:8086
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      keycloak:
        condition: service_healthy

  entreprise-service:
    <<: *service
    build:
      context: ./backend
      args:
        SERVICE: entreprise-service

  candidat-service:
    <<: *service
    build:
      context: ./backend
      args:
        SERVICE: candidat-service
    environment:
      <<: *service-env
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    depends_on:
      <<: *service-deps
      minio:
        condition: service_started

  selection-service:
    <<: *service
    build:
      context: ./backend
      args:
        SERVICE: selection-service
    environment:
      <<: *service-env
      ENTREPRISE_SERVICE_URL: http://entreprise-service:8082
      CANDIDAT_SERVICE_URL: http://candidat-service:8083

  facturation-service:
    <<: *service
    build:
      context: ./backend
      args:
        SERVICE: facturation-service
    environment:
      <<: *service-env
      CABINET_NOM: ${CABINET_NOM}
      CABINET_ADRESSE: ${CABINET_ADRESSE}
      CABINET_ICE: ${CABINET_ICE}

  notification-service:
    <<: *service
    build:
      context: ./backend
      args:
        SERVICE: notification-service
    environment:
      <<: *service-env
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      RECRUTEUR_EMAIL: ${RECRUTEUR_EMAIL}
      FRONT_URL: http://localhost:3000
    depends_on:
      <<: *service-deps
      mailpit:
        condition: service_started

  # ---------------- Front ----------------
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
        VITE_KEYCLOAK_URL: http://localhost:8180/realms/recrutement
        VITE_KEYCLOAK_CLIENT_ID: frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - gateway-service

volumes:
  postgres-data:
  minio-data:
