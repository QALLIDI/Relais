# Plateforme de pré-sélection — stack local.
#   docker compose up -d --build
# Front : http://localhost:3000 · Keycloak : http://localhost:8180 · Mailpit : http://localhost:8025
# Kafka UI : http://localhost:8090 · Kafka depuis la machine : localhost:9094
# Observabilité (Prometheus, Grafana, ELK) : à ajouter sous le profil « observabilite ».

x-service: &service
  restart: unless-stopped
  environment: &service-env
    DB_HOST: postgres
    DB_USER: ${POSTGRES_USER}
    DB_PASSWORD: ${POSTGRES_PASSWORD}
    KAFKA_BOOTSTRAP: kafka:9092
    KEYCLOAK_INTERNAL_URL: http://keycloak:8080
    KEYCLOAK_PUBLIC_URL: http://localhost:8180
    JAVA_OPTS: -XX:MaxRAMPercentage=75
  mem_limit: 512m
  # PORT ne sert qu'au healthcheck : chaque service le renseigne avec son port.
  healthcheck: &service-health
    test: ["CMD-SHELL", "curl -fs http://localhost:$${PORT}/actuator/health/readiness || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 30
    start_period: 40s
  depends_on: &service-deps
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy
    keycloak:
      condition: service_healthy

services:
  # ---------------- Infrastructure ----------------
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Kafka en un seul nœud KRaft (sans ZooKeeper). Les services créent leurs topics au démarrage.
  kafka:
    image: apache/kafka:4.1.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNE://:9092,EXTERNE://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNE://kafka:9092,EXTERNE://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNE:PLAINTEXT,EXTERNE:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNE
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "9094:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 15s

  kafka-ui:
    image: kafbat/kafka-ui:v1.3.0
    restart: unless-stopped
    environment:
      KAFKA_CLUSTERS_0_NAME: recrutement
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8090:8080"
    depends_on:
      kafka:
        condition: service_healthy

  # Données éphémères uniquement (limitation de débit, puis codes SMS) : pas de volume.
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      # L'émetteur des jetons reste http://localhost:8180 même quand les services appellent keycloak:8080.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: -Xms256m -Xmx640m
    ports:
      - "8180:8080"
    volumes:
      - ./infra/keycloak/realm-recrutement.json:/opt/keycloak/data/import/realm-recrutement.json:ro
      - ./infra/keycloak/themes/recrut:/opt/keycloak/themes/recrut:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ---------------- Services ----------------
  gateway-service:
    build:
      context: ./backend
      args:
        SERVICE: gateway-service
    restart: unless-stopped
    mem_limit: 512m
    environment:
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: http://localhost:8180
      ENTREPRISE_SERVICE_URL: http://entreprise-service:8082
      CANDIDAT_SERVICE_URL: http://candidat-service:8083
      SELECTION_SERVICE_URL: http://selection-service:8084
      FACTURATION_SERVICE_URL: http://facturation-service:8085
      NOTIFICATION_SERVICE_URL: http://notification-service:8086
      COMPTE_SERVICE_URL: http://compte-service:8088
      AGENDA_SERVICE_URL: http://agenda-service:8087
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      REDIS_HOST: redis
      PORT: "8080"
    healthcheck: *service-health
    ports:
      - "8080:8080"
    depends_on:
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy

  entreprise-service:
    <<: *service
    build:
      context: ./backend
      args:
        SERVICE: entreprise-service
    environment:
      <<: *service-env
      PORT: "8082"

  candidat-service:
    <<: *service
    build:
      context: ./backend
      args:
        SERVICE: candidat-service
    environment:
      <<: *service-env
      PORT: "8083"
      CV_STORAGE_DIR: /data/cv
    volumes:
      # Les CV sont des fichiers ordinaires sur le PC (dossier CV_DIR, par défaut ./data/cv).
      - ${CV_DIR:-./data/cv}:/data/cv

  selection-service:
    <<: *service
    build:
      context: ./backend
      args:
        SERVICE: selection-service
    environment:
      <<: *service-env
      PORT: "8084"
      ENTREPRISE_SERVICE_URL: http://entreprise-service:8082
      CANDIDAT_SERVICE_URL: http://candidat-service:8083

  facturation-service:
    <<: *service
    build:
      context: ./backend
      args:
        SERVICE: facturation-service
    environment:
      <<: *service-env
      PORT: "8085"
      CABINET_NOM: ${CABINET_NOM}
      CABINET_ADRESSE: ${CABINET_ADRESSE}
      CABINET_ICE: ${CABINET_ICE}

  notification-service:
    <<: *service
    build:
      context: ./backend
      args:
        SERVICE: notification-service
    environment:
      <<: *service-env
      PORT: "8086"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      RECRUTEUR_EMAIL: ${RECRUTEUR_EMAIL}
      FRONT_URL: http://localhost:3000
      # console : codes SMS dans les logs et dans Mailpit (aucun SMS réel en local).
      SMS_PROVIDER: ${SMS_PROVIDER:-console}
      ZAVU_API_KEY: ${ZAVU_API_KEY:-}
      ZAVU_SENDER: ${ZAVU_SENDER:-}
    depends_on:
      <<: *service-deps
      mailpit:
        condition: service_started

  agenda-service:
    <<: *service
    build:
      context: ./backend
      args:
        SERVICE: agenda-service
    environment:
      <<: *service-env
      PORT: "8087"
      SELECTION_SERVICE_URL: http://selection-service:8084
      RECRUTEUR_EMAIL: ${RECRUTEUR_EMAIL}
      # fake : lien visio Jitsi généré sans compte ; google ou microsoft une fois les adaptateurs branchés.
      VISIO_PROVIDER: ${VISIO_PROVIDER:-fake}

  # Inscription : pas de base, état dans Redis et comptes dans Keycloak (Admin API).
  compte-service:
    <<: *service
    build:
      context: ./backend
      args:
        SERVICE: compte-service
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: http://localhost:8180
      JAVA_OPTS: -XX:MaxRAMPercentage=75
      REDIS_HOST: redis
      FRONT_URL: http://localhost:3000
      COMPTE_SERVICE_SECRET: ${COMPTE_SERVICE_SECRET:-compte-service-secret}
      INSCRIPTION_SECRET: ${INSCRIPTION_SECRET:-dev-inscription-secret-a-changer}
      PORT: "8088"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  # ---------------- Front ----------------
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
        VITE_KEYCLOAK_URL: http://localhost:8180/realms/recrutement
        VITE_KEYCLOAK_CLIENT_ID: frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      gateway-service:
        condition: service_healthy

volumes:
  postgres-data:
