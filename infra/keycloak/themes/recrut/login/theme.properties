# Thème de connexion Recrut (design « Épuré ») : gabarit propre (template.ftl) et une seule feuille
# de style, sans PatternFly. Hérite des pages et scripts du thème keycloak (v1) ; login.ftl ne change
# que le lien d'inscription (vers la page /inscription du front).
parent=keycloak
import=common/keycloak
stylesCommon=
styles=css/recrut.css
meta=viewport==width=device-width,initial-scale=1
# Adresse du front si le client n'a pas d'URL de base.
frontUrl=http://localhost:3000/

# Classes simples, stylées par recrut.css (au lieu de PatternFly / Bootstrap).
kcHtmlClass=kc-html
kcBodyClass=kc-corps
kcLoginClass=kc-page
kcFormCardClass=kc-carte
kcFormHeaderClass=kc-carte-tete
kcContentWrapperClass=kc-ligne
kcLabelWrapperClass=kc-label-zone
kcInputWrapperClass=kc-champ-zone
kcFormClass=kc-formulaire
kcFormGroupClass=kc-groupe
kcFormSettingClass=kc-reglages
kcFormOptionsClass=kc-options
kcFormOptionsWrapperClass=kc-options-liens
kcFormButtonsClass=kc-boutons
kcFormButtonsWrapperClass=kc-boutons
kcLabelClass=kc-label
kcInputClass=kc-champ
kcTextareaClass=kc-champ
kcInputErrorMessageClass=kc-erreur-champ
kcInputGroup=kc-groupe-mdp
kcFormPasswordVisibilityButtonClass=kc-oeil
kcFormPasswordVisibilityIconShow=kc-icone-voir
kcFormPasswordVisibilityIconHide=kc-icone-cacher
kcButtonClass=kc-bouton
kcButtonPrimaryClass=primaire
kcButtonDefaultClass=secondaire
kcButtonBlockClass=bloc
kcButtonLargeClass=
kcAlertClass=kc-alerte
kcAlertTitleClass=kc-alerte-texte
kcFeedbackErrorIcon=
kcFeedbackWarningIcon=
kcFeedbackSuccessIcon=
kcFeedbackInfoIcon=
kcSignUpClass=kc-info
kcInfoAreaWrapperClass=kc-info-zone
kcLocaleMainClass=kc-langue
kcLocaleListClass=kc-langue-liste
kcLocaleItemClass=kc-langue-lien
kcResetFlowIcon=kc-icone-retour
kcFormSocialAccountSectionClass=kc-social
kcFormSocialAccountListClass=kc-social-liste
kcFormSocialAccountListButtonClass=kc-bouton secondaire bloc
kcMarginTopClass=kc-marge
