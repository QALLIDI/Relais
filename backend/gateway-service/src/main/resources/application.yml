server:
  # Railway fournit PORT ; en local, le port fixe du service.
  port: ${PORT:8080}
  # Derrière le proxy de Railway : l'adresse du visiteur vient de X-Forwarded-For,
  # sinon tous les anonymes partageraient le même quota de requêtes (celui du proxy).
  forward-headers-strategy: framework

spring:
  application:
    name: gateway-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Vide en local ; Railway Redis demande un mot de passe (variable REDISPASSWORD du service Redis).
      password: ${REDIS_PASSWORD:}
  security:
    oauth2:
      resourceserver:
        jwt:
          # Clés lues sur le réseau interne ; l'émetteur reste l'URL publique vue par le navigateur.
          jwk-set-uri: ${KEYCLOAK_INTERNAL_URL:http://localhost:8180}/realms/recrutement/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_PUBLIC_URL:http://localhost:8180}/realms/recrutement
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
            # Quota par utilisateur (ou par IP) : 20 requêtes/s en continu, pointes jusqu'à 60. Réponse 429 au-delà.
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${RATE_LIMIT_PAR_SECONDE:20}
                redis-rate-limiter.burstCapacity: ${RATE_LIMIT_POINTE:60}
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@cleLimitation}"
          routes:
            - id: entreprise-service
              uri: ${ENTREPRISE_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/entreprises/**,/api/missions/**
            - id: candidat-service
              uri: ${CANDIDAT_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/candidats/**
            - id: selection-service
              uri: ${SELECTION_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/candidatures/**,/api/pipeline/**,/api/shortlists/**,/api/entretiens/**,/api/selection/**
            - id: facturation-service
              uri: ${FACTURATION_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/factures/**,/api/placements/**,/api/facturation/**
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/notifications/**
            # Inscription : /public/inscription/** est ouvert sans jeton (limité par IP comme le reste).
            - id: compte-service
              uri: ${COMPTE_SERVICE_URL:http://localhost:8088}
              predicates:
                - Path=/api/comptes/**,/public/inscription/**
            - id: agenda-service
              uri: ${AGENDA_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/api/reunions/**

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
