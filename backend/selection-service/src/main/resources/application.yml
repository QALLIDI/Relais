server:
  # Railway fournit PORT ; en local, le port fixe du service.
  port: ${PORT:8084}

spring:
  application:
    name: selection-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/selection_db
    username: ${DB_USER:recrutement}
    password: ${DB_PASSWORD:recrutement}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9094}
    consumer:
      # Un groupe par service : il lit à son rythme et peut rejouer l'historique.
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_INTERNAL_URL:http://localhost:8180}/realms/recrutement/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_PUBLIC_URL:http://localhost:8180}/realms/recrutement
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000

app:
  # Adresse du front, pour le lien « passer le test » envoyé au candidat.
  front-url: ${FRONT_URL:http://localhost:3000}
  services:
    entreprise: ${ENTREPRISE_SERVICE_URL:http://localhost:8082}
    candidat: ${CANDIDAT_SERVICE_URL:http://localhost:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
