server:
  port: 8086

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/notification_db
    username: ${DB_USER:recrutement}
    password: ${DB_PASSWORD:recrutement}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9094}
    consumer:
      # Un groupe par service : il lit à son rythme et peut rejouer l'historique.
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_INTERNAL_URL:http://localhost:8180}/realms/recrutement/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_PUBLIC_URL:http://localhost:8180}/realms/recrutement

app:
  recruteur-email: ${RECRUTEUR_EMAIL:recruteur@recrutement.local}
  front-url: ${FRONT_URL:http://localhost:3000}
  mail:
    from: ${MAIL_FROM:plateforme@recrutement.local}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      enabled: false
