server:
  # Railway fournit PORT ; en local, le port fixe du service.
  port: ${PORT:8086}

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/notification_db
    username: ${DB_USER:recrutement}
    password: ${DB_PASSWORD:recrutement}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9094}
    consumer:
      # Un groupe par service : il lit à son rythme et peut rejouer l'historique.
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    # Vides en local (Mailpit) ; en production, le compte du serveur SMTP.
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_INTERNAL_URL:http://localhost:8180}/realms/recrutement/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_PUBLIC_URL:http://localhost:8180}/realms/recrutement

app:
  recruteur-email: ${RECRUTEUR_EMAIL:recruteur@recrutement.local}
  front-url: ${FRONT_URL:http://localhost:3000}
  mail:
    from: ${MAIL_FROM:plateforme@recrutement.local}
  sms:
    # console : le SMS est écrit dans les logs et dans Mailpit. zavu : envoi réel par l'API Zavu.
    provider: ${SMS_PROVIDER:console}
    zavu:
      url: ${ZAVU_URL:https://api.zavu.dev}
      api-key: ${ZAVU_API_KEY:}
      # Identifiant d'expéditeur Zavu (snd_…), facultatif : sinon l'expéditeur par défaut du compte.
      sender: ${ZAVU_SENDER:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      enabled: false
