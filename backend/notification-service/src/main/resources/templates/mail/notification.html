<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light only">
  <title th:text="${titre}">Recrut</title>
</head>
<!-- Mise en page commune des e-mails (design Épuré) : fond neutre, carte blanche, un seul bouton bleu clair.
     Tableaux et styles en ligne pour la compatibilité avec les clients de messagerie. -->
<body style="margin:0;padding:0;background:#f4f6f9;font-family:Inter,'Segoe UI',Arial,sans-serif;color:#17181c;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6f9;">
  <tr>
    <td align="center" style="padding:28px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;">
        <tr>
          <td style="padding:0 4px 14px;font-size:16px;font-weight:600;color:#17181c;">
            <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#2f6fb8;margin-right:8px;vertical-align:middle;"></span>Recrut
          </td>
        </tr>
        <tr>
          <td style="background:#ffffff;border:1px solid #eceef1;border-radius:16px;padding:28px;">
            <div th:if="${mise.surtitre()}" th:text="${mise.surtitre()}"
                 style="font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#6b6c71;margin:0 0 8px;">Surtitre</div>
            <h1 th:text="${titre}" style="margin:0 0 14px;font-size:22px;line-height:1.25;font-weight:500;color:#17181c;">Titre</h1>
            <p th:each="p : ${mise.paragraphes()}" th:text="${p}"
               style="margin:0 0 12px;font-size:14.5px;line-height:1.6;color:#3e3f44;white-space:pre-line;">Paragraphe</p>
            <table th:if="${!mise.infos().isEmpty()}" role="presentation" width="100%" cellpadding="0" cellspacing="0"
                   style="background:#f7f8fa;border-radius:12px;margin:6px 0 16px;">
              <tr th:each="i : ${mise.infos()}">
                <td th:text="${i.libelle()}" style="padding:8px 14px;font-size:13.5px;color:#6b6c71;">Libellé</td>
                <td th:text="${i.valeur()}" style="padding:8px 14px;font-size:13.5px;color:#17181c;font-weight:500;text-align:right;">Valeur</td>
              </tr>
            </table>
            <table th:if="${mise.action()}" role="presentation" cellpadding="0" cellspacing="0" style="margin:6px 0 4px;">
              <tr>
                <td style="background:#d3e6fb;border-radius:999px;">
                  <a th:href="${mise.action().url()}" th:text="${mise.action().libelle()}"
                     style="display:inline-block;padding:13px 24px;font-size:15px;font-weight:600;color:#164a7e;text-decoration:none;">Action</a>
                </td>
              </tr>
            </table>
            <p th:if="${mise.note()}" th:text="${mise.note()}"
               style="margin:16px 0 0;font-size:12.5px;line-height:1.5;color:#6b6c71;">Note</p>
          </td>
        </tr>
        <tr>
          <td style="padding:16px 4px 0;font-size:11.5px;line-height:1.6;color:#6b6c71;text-align:center;">
            Vous recevez cet e-mail parce que vous utilisez la plateforme Recrut.<br>
            <a th:href="${front}" style="color:#6b6c71;">Ouvrir Recrut</a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
