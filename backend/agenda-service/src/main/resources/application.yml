server:
  # Railway fournit PORT ; en local, le port fixe du service.
  port: ${PORT:8087}

spring:
  application:
    name: agenda-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/agenda_db
    username: ${DB_USER:recrutement}
    password: ${DB_PASSWORD:recrutement}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9094}
    consumer:
      # Un groupe par service : il lit à son rythme et peut rejouer l'historique.
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_INTERNAL_URL:http://localhost:8180}/realms/recrutement/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_PUBLIC_URL:http://localhost:8180}/realms/recrutement
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 2000

app:
  services:
    selection: ${SELECTION_SERVICE_URL:http://localhost:8084}
  recruteur:
    nom: ${RECRUTEUR_NOM:Votre recruteur}
    email: ${RECRUTEUR_EMAIL:recruteur@recrutement.local}
  # fake (local, lien Jitsi), google (Meet via Google Calendar) ou microsoft (Teams via Microsoft Graph).
  visio:
    provider: ${VISIO_PROVIDER:fake}
  rappels:
    cron: ${RAPPELS_CRON:0 */5 * * * *}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
